# allowance.autotaxsystem.co.kr - policy_pay(Allowance) Next.js UI
# 설치: sudo cp deploy/nginx-allowance.conf /etc/nginx/sites-available/allowance.autotaxsystem.co.kr
#      sudo ln -s /etc/nginx/sites-available/allowance.autotaxsystem.co.kr /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#      sudo certbot --nginx -d allowance.autotaxsystem.co.kr

server {
    listen 80;
    server_name allowance.autotaxsystem.co.kr;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
